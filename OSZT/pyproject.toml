[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oszt"
version = "0.1.0"
description = "Capability broker for an AI-operated computer"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
oszt = "oszt.cli:main"

[tool.setuptools.packages.find]
include = ["oszt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
